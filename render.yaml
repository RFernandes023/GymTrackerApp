# Servidor gratuito na Render. Os segredos (sync: false) são pedidos no painel da Render e nunca ficam no repositório.
services:
  - type: web
    name: gym-nutrition-tracker-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: npm ci --workspace=@gym/shared --workspace=@gym/backend --omit=dev
    startCommand: npm run start:prod --workspace=@gym/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: AI_TIMEOUT_MS
        value: 90000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
